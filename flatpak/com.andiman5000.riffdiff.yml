id: com.andiman5000.riffdiff
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: riff-diff

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --share=network
  - --socket=pulseaudio
  - --env=LC_ALL=C.UTF-8
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

modules:
  - name: riff-diff
    buildsystem: simple
    build-commands:
      - install -Dm755 riff-diff /app/bin/riff-diff
      - install -Dm644 com.andiman5000.riffdiff.desktop /app/share/applications/com.andiman5000.riffdiff.desktop
      - install -Dm644 rd-icon-512.png /app/share/icons/hicolor/512x512/apps/com.andiman5000.riffdiff.png
      - for s in 256 128 64 48 32; do install -Dm644 /app/share/icons/hicolor/512x512/apps/com.andiman5000.riffdiff.png /app/share/icons/hicolor/${s}x${s}/apps/com.andiman5000.riffdiff.png; done
      - install -Dm644 com.andiman5000.riffdiff.metainfo.xml /app/share/metainfo/com.andiman5000.riffdiff.metainfo.xml
    sources:
      # Paths relative to manifest location (flatpak/)
      - type: file
        path: ../src-tauri/target/release/riff-diff
      - type: file
        path: com.andiman5000.riffdiff.desktop
      - type: file
        path: ../assets/rd-icon-512.png
      - type: file
        path: com.andiman5000.riffdiff.metainfo.xml
